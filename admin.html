<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlorPoth Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
      .field {
        width: 100%;
      border-radius: 0.75rem;
      border: 1px solid #cbd5e1;
      background-color: #fff;
      padding: 0.625rem 0.75rem;
      font-size: 0.875rem;
      line-height: 1.25rem;
      color: #1e293b;
      outline: none;
    }
    .field:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 2px #a7f3d0;
    }
    body.modal-open { overflow: hidden; }
    .expandable-field { position: relative; }
    .expandable-field .field { padding-right: 3rem; }
    .manage-posts-panel { border: 1px solid #e2e8f0; box-shadow: 0 8px 24px -16px rgba(15,61,46,.28); }
    .manage-posts-scroll { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; scrollbar-color: #8aa79a #eef3ef; }
    .manage-posts-scroll::-webkit-scrollbar { width: 7px; height: 7px; }
    .manage-posts-scroll::-webkit-scrollbar-track { background: #eef3ef; border-radius: 999px; }
    .manage-posts-scroll::-webkit-scrollbar-thumb { background: #8aa79a; border: 2px solid #eef3ef; border-radius: 999px; }
    .manage-posts-scroll::-webkit-scrollbar-thumb:hover { background: #155338; }
    .manage-posts-table { min-width: 620px; table-layout: fixed; }
    .manage-posts-table th, .manage-posts-table td { vertical-align: middle; }
    .manage-posts-table th:nth-child(1), .manage-posts-table td:nth-child(1) { width: 34%; }
    .manage-posts-table th:nth-child(2), .manage-posts-table td:nth-child(2) { width: 21%; }
    .manage-posts-table th:nth-child(3), .manage-posts-table td:nth-child(3) { width: 14%; }
    .manage-posts-table th:nth-child(4), .manage-posts-table td:nth-child(4) { width: 11%; }
    .manage-posts-table th:nth-child(5), .manage-posts-table td:nth-child(5) { width: 20%; }
    .manage-posts-table td:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 640px) {
      .manage-posts-table { min-width: 580px; font-size: .8125rem; }
      .manage-posts-table th, .manage-posts-table td { padding: .625rem .5rem; }
      .manage-posts-table th:nth-child(1), .manage-posts-table td:nth-child(1) { width: 31%; }
      .manage-posts-table th:nth-child(2), .manage-posts-table td:nth-child(2) { width: 21%; }
      .manage-posts-table th:nth-child(3), .manage-posts-table td:nth-child(3) { width: 13%; }
      .manage-posts-table th:nth-child(4), .manage-posts-table td:nth-child(4) { width: 11%; }
      .manage-posts-table th:nth-child(5), .manage-posts-table td:nth-child(5) { width: 24%; }
    }
  </style>
</head>
<body class="min-h-screen bg-[#F5F3EC] text-[#20261F]">
  <div class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
    <div class="mb-6 flex items-center justify-between rounded-2xl bg-[#0A2E22] px-5 py-4 text-white shadow-lg">
      <div><h1 class="text-2xl font-bold">আলোর পথ · AlorPoth Admin</h1><p class="mt-1 text-sm text-emerald-100">কন্টেন্ট ও পাঠ-পরিসংখ্যান পরিচালনা</p></div>
      <a href="index.html" class="rounded-full border border-emerald-100/30 px-3 py-2 text-xs text-emerald-50 hover:bg-emerald-700">মূল সাইট</a>
    </div>

    <div id="auth-box" class="rounded-2xl bg-white p-5 shadow-md">
      <h2 class="mb-3 text-lg font-semibold text-slate-800">Admin Access</h2>
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Password</label>
          <input id="admin-password" type="password" class="field" placeholder="Enter admin password" />
        </div>
        <div class="flex items-end">
          <button id="unlock-btn" class="w-full rounded-xl bg-emerald-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-emerald-800">
            Unlock Form
          </button>
        </div>
      </div>
    </div>

    <section id="dashboard" class="hidden">
    <form id="content-form" class="mt-6 rounded-2xl bg-white p-5 shadow-md">
      <div class="mb-5 flex items-center justify-between gap-3">
        <h2 id="form-heading" class="text-xl font-semibold text-slate-800">Add New Source</h2>
        <button type="button" id="cancel-edit" class="hidden rounded-full border border-slate-300 px-3 py-1.5 text-xs font-medium text-slate-600">Cancel edit</button>
        <button type="button" id="logout-btn" class="rounded-full border border-slate-300 px-3 py-1.5 text-xs font-medium text-slate-600 hover:border-emerald-500 hover:text-emerald-700">
          Logout
        </button>
      </div>

      <div class="grid gap-4 md:grid-cols-2">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Topic Name</label>
          <input name="topic_name" class="field" placeholder="উদাহরণ: ঈমান" maxlength="40" />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Sub Topic</label>
          <input name="sub_topic" class="field" placeholder="উদাহরণ: মুমিনদের বৈশিষ্ট্য" maxlength="40" />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Type</label>
          <select name="type" class="field">
            <option value="quran">কুরআনের আয়াত</option>
            <option value="hadith">হাদিস</option>
            <option value="athar">আছার</option>
            <option value="fatwa">ফতোয়া</option>
          </select>
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Featured</label>
          <select name="is_featured" class="field">
            <option value="false">No</option>
            <option value="true">Yes</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <label class="mb-1 block text-sm font-medium text-slate-700">Title</label>
          <input name="title" class="field" placeholder="Entry title" maxlength="40" />
        </div>

        <div class="md:col-span-2">
          <label class="mb-1 block text-sm font-medium text-slate-700">Reference</label>
          <input name="reference" class="field" placeholder="যেমন: সূরা আল-বাকারা, আয়াত ৩-৪" maxlength="40" />
        </div>

        <div class="md:col-span-2 expandable-field">
          <label class="mb-1 block text-sm font-medium text-slate-700">Arabic Text</label>
          <textarea name="arabic_text" rows="3" class="field" placeholder="Arabic text (if available)"></textarea>
          <button type="button" data-expand-field="arabic_text" data-expand-label="Arabic Text" class="absolute right-2 top-8 rounded-lg p-1.5 text-slate-400 hover:bg-emerald-50 hover:text-emerald-700" aria-label="Expand Arabic Text" title="Open full-screen editor">
            <span aria-hidden="true">⛶</span>
          </button>
        </div>

        <div class="md:col-span-2 expandable-field">
          <label class="mb-1 block text-sm font-medium text-slate-700">Bangla Translation</label>
          <textarea name="translation_bn" rows="3" class="field" placeholder="Translation in Bangla"></textarea>
          <button type="button" data-expand-field="translation_bn" data-expand-label="Bangla Translation" class="absolute right-2 top-8 rounded-lg p-1.5 text-slate-400 hover:bg-emerald-50 hover:text-emerald-700" aria-label="Expand Bangla Translation" title="Open full-screen editor">
            <span aria-hidden="true">⛶</span>
          </button>
        </div>

        <div class="md:col-span-2 expandable-field">
          <label class="mb-1 block text-sm font-medium text-slate-700">Explanation</label>
          <textarea name="explanation" rows="4" class="field" placeholder="Explain the content clearly"></textarea>
          <button type="button" data-expand-field="explanation" data-expand-label="Explanation" class="absolute right-2 top-8 rounded-lg p-1.5 text-slate-400 hover:bg-emerald-50 hover:text-emerald-700" aria-label="Expand Explanation" title="Open full-screen editor">
            <span aria-hidden="true">⛶</span>
          </button>
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Narrator</label>
          <input name="narrator" class="field" placeholder="হজরত ওমর (রাঃ)" maxlength="40" />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Grade</label>
          <input name="grade" class="field" placeholder="সহীহ / হাসান" maxlength="40" />
        </div>

        <input name="id" type="hidden" />
      </div>

      <div class="mt-6 flex items-center justify-between gap-4">
        <div id="form-message" class="text-sm text-slate-600"></div>
        <button type="submit" class="rounded-xl bg-emerald-700 px-5 py-2.5 text-sm font-semibold text-white hover:bg-emerald-800">
          Save to Supabase
        </button>
      </div>
    </form>
    <section class="manage-posts-panel mt-6 rounded-2xl bg-white p-4 shadow-md sm:p-5"><div class="mb-4 flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-lg font-semibold text-slate-800 sm:text-xl">Manage Posts</h2><p class="mt-0.5 text-xs text-slate-500">Search, review, and manage your content</p></div><span id="table-status" class="text-xs text-slate-500 sm:text-sm"></span></div><div class="relative mb-4"><span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">⌕</span><input id="admin-search" type="search" class="field pl-9" placeholder="Search title, topic, reference, keyword..." autocomplete="off" /></div><div class="manage-posts-scroll rounded-xl border border-slate-200"><table class="manage-posts-table w-full text-left text-sm"><thead class="border-b border-slate-200 bg-slate-50 text-[10px] uppercase tracking-wide text-slate-500 sm:text-xs"><tr><th class="px-3 py-2.5">Title</th><th class="px-3 py-2.5">Topic</th><th class="px-3 py-2.5">Type</th><th class="px-3 py-2.5">Views</th><th class="px-3 py-2.5 text-right">Actions</th></tr></thead><tbody id="posts-body" class="divide-y divide-slate-100"></tbody></table></div></section>
    </section>
  </div>

  <div id="fullscreen-editor" class="fixed inset-0 z-50 hidden bg-[#0A2E22]/80 p-0 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="fullscreen-editor-title">
    <div class="flex min-h-screen flex-col bg-[#F5F3EC]">
      <header class="flex items-center justify-between gap-4 bg-[#0A2E22] px-4 py-4 text-white shadow-lg sm:px-6">
        <div><p class="text-xs uppercase tracking-[0.18em] text-emerald-200">Full-page editor</p><h2 id="fullscreen-editor-title" class="mt-1 text-lg font-semibold">Edit text</h2></div>
        <button id="close-fullscreen-editor" type="button" class="rounded-xl bg-[#C9A227] px-4 py-2 text-sm font-semibold text-[#0A2E22] hover:bg-[#E7C468]">Done</button>
      </header>
      <div class="flex flex-1 p-4 sm:p-8"><textarea id="fullscreen-editor-input" class="min-h-0 flex-1 resize-none rounded-2xl border border-slate-200 bg-white p-5 text-base leading-relaxed text-slate-800 shadow-lg outline-none focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100" spellcheck="true"></textarea></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const ADMIN_PASSWORD = 'AlorPoth2026';

      const SUPABASE_URL = 'https://hybqyfmzarxtamttyteu.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5YnF5Zm16YXJ4dGFtdHR5dGV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MDUwOTEsImV4cCI6MjEwNDI4MTA5MX0.EzZbD7RshaiI86CdNkV62PNc7-6rJjdMvkX9cAmq5GY';
      const supabaseClient = window.supabase && !window.__ALORPOTH_SUPABASE_CLIENT__
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : window.__ALORPOTH_SUPABASE_CLIENT__;
      if (supabaseClient) window.__ALORPOTH_SUPABASE_CLIENT__ = supabaseClient;

      const authBox = document.getElementById('auth-box');
      const formBox = document.getElementById('content-form');
      const passwordInput = document.getElementById('admin-password');
      const unlockBtn = document.getElementById('unlock-btn');
      const logoutBtn = document.getElementById('logout-btn');
      const formMessage = document.getElementById('form-message');

      function setMessage(text, isError = false, target = formMessage) {
        if (!target) return;
        target.textContent = text;
        target.className = `text-sm ${isError ? 'text-red-600' : 'text-slate-600'}`;
      }

      function unlockForm() {
        if (!authBox || !formBox || !passwordInput) {
          console.error('Admin form elements are missing from the page.');
          return;
        }

        const entered = passwordInput.value.trim();
        if (entered !== ADMIN_PASSWORD) {
          setMessage('Incorrect password. Only authorized users can submit.', true, document.getElementById('auth-message'));
          passwordInput.focus();
          return;
        }

        authBox.classList.add('hidden');
        authBox.style.display = 'none';
        document.getElementById('dashboard').classList.remove('hidden');
        passwordInput.value = '';
        setMessage('Authorized. You can now add content.');
      }

      function lockForm() {
        if (!authBox || !formBox) return;
        document.getElementById('dashboard').classList.add('hidden');
        authBox.classList.remove('hidden');
        authBox.style.display = 'block';
        resetEditor();
        if (passwordInput) passwordInput.value = '';
        setMessage('');
      }

      let posts = [];
      let currentEditId = null;
      let adminSearchQuery = '';
      const adminSearch = document.getElementById('admin-search');
      const postsBody = document.getElementById('posts-body');
      const tableStatus = document.getElementById('table-status');
      const formHeading = document.getElementById('form-heading');
      const cancelEdit = document.getElementById('cancel-edit');
      const fullscreenEditor = document.getElementById('fullscreen-editor');
      const fullscreenEditorInput = document.getElementById('fullscreen-editor-input');
      const fullscreenEditorTitle = document.getElementById('fullscreen-editor-title');
      const closeFullscreenEditor = document.getElementById('close-fullscreen-editor');
      let activeExpandedField = null;

      function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
      }

      function normalizeAdminSearch(value) {
        return String(value || '').normalize('NFKC').toLocaleLowerCase().replace(/[\u064B-\u065F\u0670]/g, '').replace(/[“”‘’'`.,!?;:()[\]{}\/\\|_+=*-]/g, ' ').replace(/\s+/g, ' ').trim();
      }

      function getAdminSearchText(post) {
        return normalizeAdminSearch([
          post.title, post.topic_name, post.topic_name_bn, post.topic_name_en,
          post.sub_topic, post.reference, post.translation_bn, post.explanation,
          post.arabic_text, post.narrator, post.grade, post.type,
          ...(post.tags || [])
        ].filter(Boolean).join(' '));
      }

      function getVisiblePosts() {
        const terms = normalizeAdminSearch(adminSearchQuery).split(' ').filter(Boolean);
        if (!terms.length) return posts;
        return posts.filter(post => {
          const haystack = getAdminSearchText(post);
          return terms.every(term => haystack.includes(term));
        });
      }

      function renderPosts() {
        const visiblePosts = getVisiblePosts();
        postsBody.innerHTML = visiblePosts.length ? visiblePosts.map(post => `
          <tr>
            <td class="px-3 py-3 font-medium text-emerald-800">${escapeHtml(post.title)}</td>
            <td class="px-3 py-3">${escapeHtml(post.topic_name || post.topic_name_bn || 'অন্যান্য')}</td>
            <td class="px-3 py-3">${escapeHtml(post.type)}</td>
            <td class="px-3 py-3">${Number(post.view_count || 0).toLocaleString('bn-BD')}</td>
            <td class="px-3 py-3 text-right"><button type="button" data-edit="${post.id}" class="mr-3 text-emerald-700 hover:underline">Edit</button><button type="button" data-delete="${post.id}" class="text-red-600 hover:underline">Delete</button></td>
          </tr>`).join('') : '<tr><td colspan="5" class="px-3 py-8 text-center text-slate-500">No posts found.</td></tr>';

        postsBody.querySelectorAll('[data-edit]').forEach(button => button.addEventListener('click', () => editPost(button.dataset.edit)));
        postsBody.querySelectorAll('[data-delete]').forEach(button => button.addEventListener('click', () => deletePost(button.dataset.delete)));
      }

      async function loadPosts() {
        if (!supabaseClient) return;
        const { data, error } = await supabaseClient.from('sources').select('*').order('created_at', { ascending: false });
        if (error) { tableStatus.textContent = `Load failed: ${error.message}`; return; }
        posts = data || [];
        tableStatus.textContent = `${posts.length} posts · live view counts`;
        renderPosts();
      }

      function editPost(id) {
        const post = posts.find(item => String(item.id) === String(id));
        if (!post) return;
        ['topic_name', 'sub_topic', 'type', 'title', 'reference', 'arabic_text', 'translation_bn', 'explanation', 'narrator', 'grade'].forEach(name => { formBox.elements[name].value = post[name] || ''; });
        formBox.elements.is_featured.value = String(Boolean(post.is_featured));
        currentEditId = post.id;
        formBox.elements.id.value = post.id;
        formHeading.textContent = 'Update Source';
        cancelEdit.classList.remove('hidden');
        formBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      async function deletePost(id) {
        const post = posts.find(item => String(item.id) === String(id));
        if (!post) {
          setMessage('Delete failed: post was not found.', true);
          return;
        }
        if (!window.confirm('Are you sure you want to delete this item?')) return;
        if (!window.confirm('This action cannot be undone. Are you absolutely sure?')) return;

        setMessage('Deleting post...');
        const { error } = await supabaseClient.from('sources').delete().eq('id', id);
        if (error) return setMessage(`Delete failed: ${error.message}`, true);
        setMessage('Post deleted.');
        await loadPosts();
      }

      function resetEditor() {
        formBox.reset();
        currentEditId = null;
        formBox.elements.id.value = '';
        formHeading.textContent = 'Add New Source';
        cancelEdit.classList.add('hidden');
        closeFullscreenEditorView();
      }

      function openFullscreenEditor(fieldName, label) {
        const field = formBox.elements[fieldName];
        if (!field || !fullscreenEditor || !fullscreenEditorInput) return;
        activeExpandedField = field;
        fullscreenEditorTitle.textContent = label;
        fullscreenEditorInput.placeholder = field.placeholder || `Write ${label.toLowerCase()}...`;
        fullscreenEditorInput.value = field.value;
        fullscreenEditor.classList.remove('hidden');
        document.body.classList.add('modal-open');
        fullscreenEditorInput.focus();
      }

      function closeFullscreenEditorView() {
        if (!fullscreenEditor) return;
        if (activeExpandedField && fullscreenEditorInput) activeExpandedField.value = fullscreenEditorInput.value;
        activeExpandedField = null;
        fullscreenEditor.classList.add('hidden');
        document.body.classList.remove('modal-open');
      }

      if (unlockBtn) {
        unlockBtn.addEventListener('click', () => { unlockForm(); loadPosts(); });
      }

      if (logoutBtn) {
        logoutBtn.addEventListener('click', lockForm);
      }

      if (passwordInput) {
        passwordInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') unlockForm();
        });
      }

      if (formBox) {
        formBox.addEventListener('submit', async (event) => {
          event.preventDefault();

          if (!supabaseClient) {
            setMessage('Supabase client failed to load. Check the CDN script tag and browser console.', true);
            return;
          }

          const formData = new FormData(formBox);
          const payload = {
            topic_name: formData.get('topic_name')?.toString().trim() || '',
            sub_topic: formData.get('sub_topic')?.toString().trim() || null,
            type: formData.get('type')?.toString().trim() || 'hadith',
            title: formData.get('title')?.toString().trim() || '',
            reference: formData.get('reference')?.toString().trim() || null,
            arabic_text: formData.get('arabic_text')?.toString().trim() || null,
            translation_bn: formData.get('translation_bn')?.toString().trim() || null,
            explanation: formData.get('explanation')?.toString().trim() || '',
            narrator: formData.get('narrator')?.toString().trim() || null,
            grade: formData.get('grade')?.toString().trim() || null,
            is_featured: formData.get('is_featured') === 'true'
          };

          try {
            const wasEditing = Boolean(currentEditId);
            const query = currentEditId
              ? supabaseClient.from('sources').update(payload).eq('id', currentEditId).select()
              : supabaseClient.from('sources').insert([payload]).select();
            const { data, error } = await query;
            if (error) throw error;

            setMessage(wasEditing ? 'Content updated successfully.' : `Content saved successfully to Supabase. ${data?.length ? 'Record inserted.' : ''}`);
            resetEditor();
            await loadPosts();
          } catch (err) {
            console.error('Supabase insert error:', err);
            setMessage('Submit failed. Please verify the table columns, RLS policy, and Supabase permissions.', true);
          }
        });
      }

      if (cancelEdit) cancelEdit.addEventListener('click', resetEditor);
      if (adminSearch) adminSearch.addEventListener('input', event => { adminSearchQuery = event.target.value; renderPosts(); });
      document.querySelectorAll('[data-expand-field]').forEach(button => {
        button.addEventListener('click', () => openFullscreenEditor(button.dataset.expandField, button.dataset.expandLabel));
      });
      if (fullscreenEditorInput) fullscreenEditorInput.addEventListener('input', () => {
        if (activeExpandedField) activeExpandedField.value = fullscreenEditorInput.value;
      });
      if (closeFullscreenEditor) closeFullscreenEditor.addEventListener('click', closeFullscreenEditorView);
      if (fullscreenEditor) fullscreenEditor.addEventListener('click', event => {
        if (event.target === fullscreenEditor) closeFullscreenEditorView();
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && activeExpandedField) closeFullscreenEditorView();
      });
    });
  </script>
</body>
</html>
